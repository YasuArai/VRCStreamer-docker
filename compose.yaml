services:
  vrcstreamer:
    build: .
    image: ghcr.io/yasuarai/vrcstreamer-docker
    container_name: vrcstreamer
    restart: unless-stopped
    ports:
      - 8443:8443
      - 8554:8554
    volumes:
      - /opt/stacks/vrcstreamer/certs:/certs:ro
    environment:
      SERVER_NAME: VRCStreamer
      SERVER_DESCRIPTION: ""
      BIND_ADDR: 0.0.0.0:8443
      TLS_CERT_PATH: /certs/cert.pem
      TLS_KEY_PATH: /certs/key.pem
      RTSP_BIND_ADDR: 0.0.0.0:8554
      RTSP_EXTRA_BIND_ADDR: ""
      ALLOWED_ORIGINS: https://vard.cc
      MAX_PUBLISHERS: "500"
      MAX_PUBLISHERS_PER_IP: "3"
      MAX_LISTENERS_TOTAL: "2500"
      MAX_LISTENERS_PER_STREAM: "85"
      MAX_HTTP_REQUESTS_PER_IP: "120"
      HTTP_RATE_LIMIT_WINDOW_SECS: "60"
      MAX_TRACKED_IPS: "8192"
      MAX_AAC_FRAME_BYTES: "4096"
      MAX_INGEST_BYTES_PER_SEC: "98304"
      CHANNEL_BUFFER: "128"
      PUBLISHER_IDLE_TIMEOUT_SECS: "120"
      PASSWORD: ""
      CODE_MIN_BYTES: "8"
      CODE_MAX_BYTES: "128"
      RUST_LOG: debug
networks: {}
